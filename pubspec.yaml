name: finders_keepers
description: "Finders Keepers? - Campus Lost-and-Found Mobile Application for CodeChef-VIT"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # Mapping (OpenStreetMap / FlutterMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Image handling & UI utilities
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

  # Local persistence & utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
